; ESP32-C3 Super Mini + a round GC9 SPI display.
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"
;
;   supermini          1.28" GC9A01, 240x240  (the shipping build)
;   supermini_gc9b72   2.1"  GC9B72, 360x360
;
; Wiring for both is in README.md.

[env]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  ; Panel_GC9B72 was added in LovyanGFX 1.2.28.
  lovyan03/LovyanGFX@^1.2.28
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]
; 1.28" GC9A01 240x240 — the default panel, no extra flags.

[env:supermini_gc9b72]
; 2.1" GC9B72 360x360.
build_flags =
  ${env.build_flags}
  -DPLANE_RADAR_PANEL_GC9B72

