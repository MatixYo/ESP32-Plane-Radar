; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

; Shared by both destinations. Pinned exactly, not by caret range: the radar's layout is
; derived from LovyanGFX's VLW font metrics, so a silent minor bump in one env and not the
; other would break the device-vs-native pixel comparison. These are the versions that
; `^1.2.7` / `^7.4.2` actually resolved to.
[common]
lib_deps =
  lovyan03/LovyanGFX@1.2.26
  bblanchon/ArduinoJson@7.4.3

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; The Super Mini flashes over the ESP32-C3's built-in USB Serial/JTAG, where
; esptool's flasher stub stops responding right after "Stub running..."
; ("Unable to verify flash chip connection"). The ROM loader is slower but
; reliable here, and the nominal baud rate is meaningless over USB CDC.
upload_flags = --no-stub
upload_speed = 115200

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  ${common.lib_deps}
  tzapu/WiFiManager@^2.0.17

build_src_filter = +<*> -<platform/native/>

; Debug firmware: same sources as release, -Og -g, USB JTAG for on-device GDB.
[env:supermini_debug]
extends = env:supermini
build_type = debug
debug_tool = esp-builtin

; --- Native destination: dev/design harness on the host -----------------------
; Same sources, LovyanGFX's SDL panel instead of the GC9A01 panel. Not an
; emulator: this is a plain host binary built from the shared code.
;
; build_src_filter starts narrow and widens as each file is ported off Arduino.
; Keeping this env green at every step is what mechanically enforces that
; core/ and ui/ stay free of Arduino headers.
[env:native]
platform = native
; Everything except the device platform layer. main.cpp is shared verbatim.
build_src_filter = +<*> -<platform/device/>

; Warnings go in build_src_flags, not build_flags: the latter is also applied to
; LovyanGFX's own sources. The -Wno- list is entirely third-party noise from
; LovyanGFX headers pulled into our translation units; leaving it on would bury
; any real warning of ours.
build_src_flags =
  -Wall -Wextra
  -Wno-unused-parameter
  -Wno-vla-cxx-extension
  -Wno-deprecated-copy

build_flags =
  -std=gnu++17 -O0 -g
  -DPLANE_RADAR_NATIVE
  -DLGFX_AUTODETECT
  -DPLANE_RADAR_FONT_PATH='"$PROJECT_DIR/data/ui_font.vlw"'
  -I/opt/homebrew/include/SDL2 -I/usr/local/include/SDL2
  -L/opt/homebrew/lib -L/usr/local/lib
  -lSDL2 -lcurl

lib_deps = ${common.lib_deps}

; --- Host unit tests ----------------------------------------------------------
; Run with: pio test -e native_test   (or `make test`)
; Same sources as env:native minus the harness main(), which would collide with
; the one Unity generates. Only pure logic is covered here — no UI, no network.
[env:native_test]
platform = native
test_framework = unity
; Without this PlatformIO builds only test/, and every core:: symbol is undefined.
test_build_src = yes
; test_terrain_fetch links its own fake HttpClient/clock, which would collide
; with the real http_curl.cpp built here; it runs in native_test_fetch instead.
; test_terrain_live downloads real terrain tiles and is opt-in via
; native_test_live (`make test-live`) so `make test` stays offline-safe.
; test_png needs png_decode.cpp, which is not built here; it runs in
; native_test_png instead.
test_ignore =
  test_terrain_fetch
  test_terrain_live
  test_png

build_src_filter =
  -<*>
  +<core/>
  +<platform/native/platform_native.cpp>
  +<platform/native/kv_json_file.cpp>
  +<platform/native/http_curl.cpp>

build_src_flags = -Wall -Wextra -Wno-unused-parameter

build_flags =
  -std=gnu++17 -O0 -g
  -DPLANE_RADAR_NATIVE
  ; Unity compiles out its double asserts by default; lat/lon are doubles.
  -DUNITY_INCLUDE_DOUBLE
  -L/opt/homebrew/lib -L/usr/local/lib
  -lcurl

; ArduinoJson only — core/adsb.cpp and the JSON settings store need it.
; LovyanGFX is deliberately absent: nothing under test draws, and pulling it in
; would drag SDL into the test run.
lib_deps = bblanchon/ArduinoJson@7.4.3

; --- Fetch-flow tests -----------------------------------------------------------
; Same core sources, but WITHOUT http_curl.cpp and platform_native.cpp: the
; test file provides a scripted HttpClient::get and a hand-cranked nowMs(), and
; injects a fake PNG decoder through core::terrain::setPngDecoder(). So the tile
; download state machine (one tile per call, request spacing, in-place retries,
; abandonment) AND the tile-to-grid resampler run deterministically with no
; network, no real clock and no PNG library — which is also why LovyanGFX is
; absent here. Run with: pio test -e native_test_fetch   (part of `make test`)
[env:native_test_fetch]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_terrain_fetch

build_src_filter =
  -<*>
  +<core/>
  +<platform/native/kv_json_file.cpp>

build_src_flags = -Wall -Wextra -Wno-unused-parameter

build_flags =
  -std=gnu++17 -O0 -g
  -DPLANE_RADAR_NATIVE
  -DUNITY_INCLUDE_DOUBLE

lib_deps = bblanchon/ArduinoJson@7.4.3

; --- Live tile smoke test ---------------------------------------------------------
; Real terrain-RGB tiles off the AWS elevation-tiles-prod bucket, fetched
; through the same http_curl.cpp backend the native harness uses and decoded by
; the REAL platform/png_decode.cpp. Needs the internet — hence opt-in, never
; part of `make test`. A couple of tiles, so it runs in seconds; the bucket is
; unthrottled and asks for no key. Run with: make test-live
;
; The decoder is ours and allocates nothing, so this env links neither LovyanGFX
; nor SDL2 — on the device the scratch it decodes into is the frame sprite's own
; pixels, and here the test simply lends it a static array.
[env:native_test_live]
extends = env:native_test
test_filter = test_terrain_live
test_ignore =
  test_terrain_fetch
  test_png

build_src_filter =
  ${env:native_test.build_src_filter}
  +<platform/png_decode.cpp>

; --- PNG decoder tests ----------------------------------------------------------
; The one env that builds platform/png_decode.cpp against fixtures instead of the
; network. It exists separately because of what it must NOT link: LovyanGFX, and
; through it SDL2, whose macOS headers #define main and would rename Unity's
; entry point. Nothing here draws and nothing fetches, so neither belongs.
;
; It compiles that single source and no other — core/ is not needed, since the
; decoder touches only headers from it, and leaving platform_native.cpp out lets
; the test file stub logf() into silence so twenty-odd decodes stay readable.
; Fixtures come from scripts/gen_png_fixtures.py; regenerate after touching it.
; Run with: pio test -e native_test_png
[env:native_test_png]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_png

build_src_filter =
  -<*>
  +<platform/png_decode.cpp>

build_src_flags = -Wall -Wextra -Wno-unused-parameter

build_flags =
  -std=gnu++17 -O0 -g
  -DPLANE_RADAR_NATIVE
