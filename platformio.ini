; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Classic ESP32-TFT 88267 — ESP32-D0WD + integrated GC9A01 round (parts-catalog bench ID 2026-06-02)
; USB: WCH CH343 (1A86:55D3). Flash: 16 MB.

[env:esp32-tft-round]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_resetmethod = nodemcu
board_build.flash_size = 16MB
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw

upload_flags =
  --no-stub

build_flags =
  -DPLANE_RADAR_BOARD_ESP32_TFT_ROUND
  -DWM_NODEBUG
  -DWM_MDNS
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Waveshare ESP32-P4-WIFI6-Touch-LCD-4C — 720×720 MIPI DSI (JD9365), ESP32-C6 Wi-Fi 6
; Toolchain: pioarduino (official platform-espressif32 lacks ESP32-P4)

[env:esp32-p4-waveshare-4c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 32MB
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw

build_flags =
  -DPLANE_RADAR_BOARD_ESP32_P4_WAVESHARE_4C
  -DWM_NODEBUG
  -DBOARD_HAS_PSRAM
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  -DCONFIG_ESP32_PHY_MAX_WIFI_TX_POWER=20

lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#develop
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
