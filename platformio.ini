; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  ; Pinned: LovyanGFX >= 1.2.24 turned the trailing `namespace fonts` in
  ; lgfx/v1/lgfx_fonts.hpp from a namespace *alias* into a real namespace,
  ; which collides with this project's `namespace fonts = lgfx::v1::fonts;`
  ; aliases (radar_display / status_screens / runway_overlay). 1.2.21 is the
  ; last release that still uses an alias. Was: @^1.2.7 (now resolves to 1.2.28).
  lovyan03/LovyanGFX@1.2.21
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
